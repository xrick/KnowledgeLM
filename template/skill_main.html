            // ===== Sidebar Resize =====
            const SIDEBAR_MIN_WIDTH = 240;
            const SIDEBAR_MAX_WIDTH = 500;
            const SIDEBAR_DEFAULT_WIDTH = 280;
            const SIDEBAR_WIDTH_KEY = "docai_sidebar_width";

            function initSidebarResize() {
                const sidebar = document.querySelector(".sidebar");
                const handle = document.getElementById("sidebar-resize-handle");

                if (!sidebar || !handle) return;

                // Restore saved width
                const savedWidth = localStorage.getItem(SIDEBAR_WIDTH_KEY);
                if (savedWidth) {
                    const width = parseInt(savedWidth, 10);
                    if (
                        width >= SIDEBAR_MIN_WIDTH &&
                        width <= SIDEBAR_MAX_WIDTH
                    ) {
                        sidebar.style.width = width + "px";
                    }
                }

                let isResizing = false;
                let startX = 0;
                let startWidth = 0;

                function startResize(e) {
                    isResizing = true;
                    startX = e.clientX || e.touches?.[0]?.clientX || 0;
                    startWidth = sidebar.offsetWidth;

                    document.body.classList.add("resizing");
                    handle.classList.add("dragging");
                    sidebar.style.transition = "none"; // Disable transition while dragging

                    e.preventDefault();
                }

                function doResize(e) {
                    if (!isResizing) return;

                    const clientX = e.clientX || e.touches?.[0]?.clientX || 0;
                    const delta = clientX - startX;
                    let newWidth = startWidth + delta;

                    // Apply constraints
                    newWidth = Math.max(
                        SIDEBAR_MIN_WIDTH,
                        Math.min(SIDEBAR_MAX_WIDTH, newWidth),
                    );

                    sidebar.style.width = newWidth + "px";
                }

                function stopResize() {
                    if (!isResizing) return;

                    isResizing = false;
                    document.body.classList.remove("resizing");
                    handle.classList.remove("dragging");
                    sidebar.style.transition = ""; // Re-enable transition

                    // Save width to localStorage
                    const currentWidth = sidebar.offsetWidth;
                    localStorage.setItem(
                        SIDEBAR_WIDTH_KEY,
                        currentWidth.toString(),
                    );
                }

                // Mouse events
                handle.addEventListener("mousedown", startResize);
                document.addEventListener("mousemove", doResize);
                document.addEventListener("mouseup", stopResize);

                // Touch events for mobile
                handle.addEventListener("touchstart", startResize, {
                    passive: false,
                });
                document.addEventListener("touchmove", doResize, {
                    passive: false,
                });
                document.addEventListener("touchend", stopResize);

                // Double-click to reset to default
                handle.addEventListener("dblclick", () => {
                    sidebar.style.width = SIDEBAR_DEFAULT_WIDTH + "px";
                    localStorage.setItem(
                        SIDEBAR_WIDTH_KEY,
                        SIDEBAR_DEFAULT_WIDTH.toString(),
                    );
                });
            }

            let currentLang = "zh"; // 'zh' for Chinese, 'en' for English

            // Load UI translations on page load
            async function loadUITranslations() {
                try {
                    const response = await fetch(
                        "/static/i18n/ui_translations.json",
                    );
                    if (response.ok) {
                        uiTranslations = await response.json();
                        console.log("UI translations loaded");
                    }
                } catch (error) {
                    console.error("Failed to load UI translations:", error);
                    // Use inline fallback
                    uiTranslations = {
                        zh: { lang_toggle: "英文 ↔ 中文" },
                        en: { lang_toggle: "English ↔ 中文" },
                    };
                }
            }

            // Get translation by key path (e.g., "chat.welcome_title")
            function t(keyPath, params = {}) {
                if (!uiTranslations || !uiTranslations[currentLang])
                    return keyPath;

                const keys = keyPath.split(".");
                let value = uiTranslations[currentLang];

                for (const key of keys) {
                    if (value && typeof value === "object" && key in value) {
                        value = value[key];
                    } else {
                        return keyPath; // Key not found, return path as fallback
                    }
                }

                // Replace parameters like {skill}, {count}, {name}
                if (typeof value === "string") {
                    Object.entries(params).forEach(([key, val]) => {
                        value = value.replace(`{${key}}`, val);
                    });
                }

                return value;
            }

                          .map((s) => s.id)
                    : [];

                // Re-render skills to update "Main" label and all dynamic text
                // NEW: Check if data is from tree endpoint or legacy format

                        if (allAreDocuments && selectedSkills.length > 0) {

                            selectedSkills.forEach((skill) => {

                                const groupHeader = document.querySelector(
                                    `.skill-group-header[data-group-id="${groupId}"]`,

                                        );

                                        allGroupDocuments,

                                    // Check if all documents in the group are selected
                                    const allGroupDocsSelected =
                                        allGroupDocumentIds.every((id) =>
                                            selectedIds.has(id),

                                    if (
                                        allGroupDocsSelected &&
                                        allGroupDocumentIds.length ===

                                        // Also restore checkboxes
                                        selectedSkills.forEach((skill) => {
                                            const checkbox =

                                    }
                                }
                            }
                        }

                        // Otherwise, restore individual selections
                        selectedSkills.forEach((skill) => {
                            const skillId = skill.id;
                            if (!skillId) return;

                            // For main/head skills, find the group header or skill item
                            if (skill.isMain || skill.isHead) {
                                // Try skill-group-header first (for skills with documents)
                                let element = document.querySelector(
                                    `.skill-group-header[data-head-id="${skillId}"]`,

                                        `.skill-group-header[data-skill-id="${skillId}"]`,
                                    );
                                }
                                if (!element) {
                                    // Try simple skill-item (for skills without documents)
                                    element = document.querySelector(
                                        `.skill-item[data-head-id="${skillId}"]`,
                                    );
                                }
                                if (!element) {
                                    // Try skill-item with data-skill-id

            // NOTE: Skill names are NOT translated per user requirement (rule-1)

            // ===== Load Skills =====
            // NEW: Use /tree endpoint (skill_heads architecture)
            async function loadSkills() {
                try {
                    // NEW: Use tree endpoint for skill_heads architecture
                    const response = await fetch("/api/v1/skills/tree");
                    const apiResponse = await response.json();

                    // API returns: {"skill_tree": [...], "total_skills": N, ...}
                    // Extract skill_tree array for processing
                    const treeData = apiResponse.skill_tree || apiResponse;

                    // Normalize enabled field (SQLite may return 0/1 or boolean)
                    // Filter out disabled skills (only show enabled skills on main page)
                    const enabledSkills = treeData.filter((skill) => {
                        // Normalize enabled status
                        if (
                            skill.enabled === 0 ||
                            skill.enabled === "0" ||
                            skill.enabled === null ||
                            skill.enabled === false
                        ) {
                            return false; // Disabled
                        } else if (
                            skill.enabled === 1 ||
                            skill.enabled === "1" ||
                            skill.enabled === true
                        ) {
                            return true; // Enabled
                        }
                        // If undefined, default to enabled
                        return true;
                    });

                    // Cache tree data for lookups (use filtered enabled skills)
                    allSkillsData = enabledSkills;
                    renderSkillTree(enabledSkills);

                    // NOTE: Removed initializeAllSelected() - now defaults to "none selected"
                } catch (error) {
                    console.error("Failed to load skills:", error);
                    // Fallback to old endpoint if tree fails
                    try {
                        let response = await fetch("/api/v1/skills/demo");
                        let skills = await response.json();
                        if (!skills || skills.length === 0) {
                            response = await fetch("/api/v1/skills/");
                            skills = await response.json();
                        }
                        allSkillsData = skills;
                        renderSkills(skills);
                        // NOTE: Removed initializeAllSelected() - now defaults to "none selected"
                    } catch (fallbackError) {
                        console.error("Fallback also failed:", fallbackError);
                        showFallbackSkills();
                    }
                }
            }

            function selectSkillItemFromTree(

                element,

                // For skills with no documents, we select the head_id directly

                selectedSkills = [

                        isHead: true,
                    },
                ];

            // ===== Group Skills by Name (Legacy - kept for backward compatibility) =====
            function groupSkillsByName(skills) {
                const groups = {};

                // Normalize skills with parent_skill_id, source_name, and display_order
                const normalizedSkills = skills.map((skill) => ({
                    id: skill.id || skill.skill_id,
                    name: skill.name || skill.skill_name,
                    category: skill.tag || skill.skill_category || "General",
                    chunks: skill.chunkCount || skill.total_chunks || 0,
                    status: skill.status || "ready",
                    created: skill.created_at || skill.id,
                    parent_skill_id: skill.parent_skill_id || "root",
                    source_name: skill.source_name || "", // Document name for instant attachments
                    display_order:
                        skill.display_order !== undefined
                            ? skill.display_order
                            : 999, // NEW: Include display_order
                }));

                // First pass: identify main skills (parent_skill_id = 'root' and not System Root)
                normalizedSkills.forEach((skill) => {
                    if (
                        skill.parent_skill_id === "root" &&
                        skill.id !== "root"
                    ) {
                        groups[skill.id] = {
                            main: skill,
                            attachments: [],
                            display_order: skill.display_order, // Store display_order at group level
                        };
                    }
                });

                // Second pass: attach instant attachments to their parent
                normalizedSkills.forEach((skill) => {
                    if (
                        skill.parent_skill_id !== "root" &&
                        groups[skill.parent_skill_id]
                    ) {
                        groups[skill.parent_skill_id].attachments.push(skill);
                    }
                });

                return groups;
            }

            if (!group.classList.contains('expanded')) {

                clearAllSelections();

                selectedSkills = [];

                if (skill.documents && skill.documents.length > 0) {
                    skill.documents.forEach((doc) => {
                        selectedSkills.push({
                            id: doc.skill_id,
                            name: doc.source_name || "Document",

                            category: category,
                            isAttachment: true,
                        });

                        checkedItems.add(doc.skill_id);

                        const checkbox = document.querySelector(

                    });

                    // Update the "select all" checkbox for this group
                    const selectAllCheckbox = document.getElementById(
                        `skill-select-all-${groupId}`,
                    );
                    if (selectAllCheckbox) selectAllCheckbox.checked = true;
                } else {
                    // ✅ FIX: For skills without documents (legacy architecture),
                    // use the head_id directly as the skill_id for querying
                    // This allows old skills with FAISS indices to still work
                    selectedSkills.push({
                        id: headId,
                        name: name,
                        chunks: totalChunks,
                        category: category,
                        isHead: true,
                        isMain: true,
                    });
                    checkedItems.add(headId);

                        `[handleSkillGroupClick] Legacy skill with no documents, using headId: ${headId}`,
                    );
                }

                // 7. Update UI
                updateSelectAllState();
                const totalCount = selectedSkills.length;
                updateSelectionUI(name, category, false, totalCount);

                console.log(
                    `[handleSkillGroupClick] Selected skill "${name}" with ${totalCount} documents`,
                );
            }

            // ===== Render Skills (3-Level Tree) =====
            function renderSkills(skills) {
                const container = document.getElementById("skills-list");
                container.innerHTML = "";

                if (!skills || skills.length === 0) {
                    container.innerHTML = `
                    <div class="skill-item" style="color: var(--text-muted); cursor: default;">
                        <span class="skill-icon">📭</span>
                        <span class="skill-name">${t("skill_tree.no_skills")}</span>
                    </div>
                `;
                    return;
                }

                const groups = groupSkillsByName(skills);

                // Sort groups by display_order
                const sortedGroups = Object.entries(groups).sort((a, b) => {
                    const orderA =
                        a[1].display_order !== undefined
                            ? a[1].display_order

            // ===== OPMP Progressive Streaming Feature Toggle =====
            const USE_PROGRESSIVE_STREAMING = true; // Set to false to use traditional method

            // ===== Smart Auto-Scroll Logic (GLOBAL) =====
            // Make these global so external JS files can access
            window.userHasScrolled = false;
            window.scrollTimeout = null;

            // Detect when user manually scrolls
            window.setupScrollDetection = function () {
                const chatArea = document.getElementById("chat-area");
                if (!chatArea) return;

                chatArea.addEventListener("scroll", function () {
                    // ✅ Standard chat UX: scrollTop near scrollHeight means viewing newest (at bottom)
                    const isAtBottom =
                        chatArea.scrollHeight -
                            chatArea.scrollTop -
                            chatArea.clientHeight <=
                        50;

                    if (!isAtBottom) {
                        // User scrolled UP to see older messages - disable auto-scroll
                        window.userHasScrolled = true;
                        console.log(
                            "User viewing old messages - auto-scroll disabled",
                        );
                    } else {
                        // User at bottom (newest messages) - re-enable auto-scroll
                        window.userHasScrolled = false;
                        console.log(
                            "User viewing newest - auto-scroll enabled",
                        );
                    }
                });
            };

            // ✅ Standard chat UX: Scroll to bottom to show newest messages
            window.scrollToBottomIfNeeded = function (container) {
                if (!window.userHasScrolled) {
                    container.scrollTop = container.scrollHeight; // Scroll to bottom for newest
                }
            };

            // Scroll to show a specific message at the top of the chat area
            // ✅ FIX: 動態計算並撐開容器，確保新訊息能被捲到最頂端
            window.scrollMessageToTop = function (messageElement) {
                const chatArea = document.getElementById("chat-area");
                const chatMessages = document.getElementById("chat-messages");

                if (!chatArea || !chatMessages || !messageElement) return;

                // On mobile, use simpler scroll behavior to avoid layout issues
                const isMobile = window.innerWidth <= 768;
                if (isMobile) {
                    // On mobile, just ensure message is visible without aggressive scrolling
                    messageElement.scrollIntoView({
                        behavior: "smooth",
                        block: "nearest",
                    });
                    window.userHasScrolled = false;
                    return;
                }

                // ✅ 步驟 1: 先確保有足夠的底部 padding（使用 100vh 保證足夠空間）
                chatMessages.style.paddingBottom = "100vh";

                // ✅ 步驟 2: 使用 setTimeout 確保 padding 生效後再計算位置
                setTimeout(() => {
                    // 使用雙重 RAF 確保 DOM 完全更新
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            // ✅ FIX: 使用 getBoundingClientRect 計算精確位置
                            const chatAreaRect =
                                chatArea.getBoundingClientRect();
                            const messageRect =
                                messageElement.getBoundingClientRect();

                            // 計算 message 相對於 chatArea 可視區域頂部的距離
                            const currentScrollTop = chatArea.scrollTop;
                            const messageTopRelativeToViewport =
                                messageRect.top - chatAreaRect.top;
                            const targetTop =
                                currentScrollTop + messageTopRelativeToViewport;

                            // ✅ 執行捲動
                            chatArea.scrollTop = targetTop;

                            // 重置手動捲動標記
                            window.userHasScrolled = false;

                            console.log("🚀 Scrolled to new query:", {
                                currentScrollTop: currentScrollTop,
                                messageTopRelativeToViewport:
                                    messageTopRelativeToViewport,
                                targetTop: targetTop,
                                finalScrollTop: chatArea.scrollTop,
                            });
                        });
                    });
                }, 50); // 50ms 延遲確保 padding 變更已生效
            };

            // Initialize scroll detection when page loads
            window.setupScrollDetection();

            // ===== Stop Generation =====
            function stopGeneration() {
                if (currentAbortController) {
                    console.log("🛑 User initiated stop generation");
                    currentAbortController.abort();
                    currentAbortController = null;

                    // Reset button state immediately
                    const button = document.getElementById("send-button");
                    const buttonIcon = button.querySelector("i");
                    const buttonText = button.querySelector("span");
                    isLoading = false;
                    button.classList.remove("loading", "streaming");
                    button.onclick = sendQuery; // Restore send function
                    if (buttonIcon) {
                        buttonIcon.className = "fa-solid fa-paper-plane";
                    }
                    if (buttonText) buttonText.textContent = "搜尋";

                    // Re-enable/disable based on input content
                    const input = document.getElementById("query-input");
                    const inputValue = input.value.trim();
                    button.disabled = inputValue === "";
                }
            }

            // ===== Send Query =====
            async function sendQuery() {
                // If currently streaming, stop instead of sending
                if (isLoading && currentAbortController) {
                    stopGeneration();
                    return;
                }

                if (selectedSkills.length === 0 || isLoading) return;

                const input = document.getElementById("query-input");
                const query = input.value.trim();

                if (!query) return;

                // ✅ IMPORTANT: DO NOT add user message here
                // It will be added AFTER the response/progress containers
                // to ensure it appears at the TOP
                input.value = "";

                // Route to progressive streaming or traditional method
                if (USE_PROGRESSIVE_STREAMING) {
                    await sendProgressiveQuery(query);
                } else {
                    await sendTraditionalQuery(query);
                }
            }

            // ===== Progressive Streaming Query (OPMP) =====
            async function sendProgressiveQuery(query) {
                isLoading = true;
                const button = document.getElementById("send-button");
                const buttonIcon = button.querySelector("i");
                const buttonText = button.querySelector("span");

                // ✅ Create AbortController for this query
                currentAbortController = new AbortController();

                // ✅ Transform to Stop button (streaming mode) with grey stop icon
                button.classList.add("streaming");
                button.classList.remove("loading");
                button.disabled = false; // Enable so user can click to stop
                if (buttonIcon) {
                    buttonIcon.className = "fa-solid fa-stop";
                }
                if (buttonText) buttonText.textContent = "停止";

                // Change onclick to stop function
                button.onclick = stopGeneration;

                try {
                    // ✅ Expand Head IDs to include all child document IDs
                    const documentIds = [];

                    for (const skill of selectedSkills) {
                        if (skill.children && skill.children.length > 0) {
                            // Has children → Add all child IDs
                            documentIds.push(
                                ...skill.children.map((child) => child.id),
                            );
                            console.log(
                                `📁 Expanded "${skill.skill_name}": ${skill.children.length} documents`,
                            );
                        } else {
                            // No children → Add skill itself
                            documentIds.push(skill.id);
                        }
                    }

                    console.log(
                        `📄 Total Document IDs: ${documentIds.length} docs`,
                        documentIds,
                    );

                    const skillId = selectedSkills[0].id;

                    // Create unique IDs for this query's progress bar and response container
                    const timestamp = Date.now();
                    const progressId = `progress-${timestamp}`;
                    const containerId = `response-${timestamp}`;

                    const chatMessages =
                        document.getElementById("chat-messages");

                    // ✅ Standard chat layout: Append in FORWARD order
                    // Normal column will display oldest at top, newest at bottom
                    // Visual order: Query (right) → Progress → Response (left)

                    // Step 1: Add user query (appears at right side)
                    const userMessageElement = addMessage(query, "user");

                    // Step 2: Create progress bar (below user query) - DISABLED
                    const progressContainer = document.createElement("div");
                    progressContainer.className = "progress-container";
                    progressContainer.id = progressId;
                    progressContainer.style.display = "none"; // Hide progress bar completely
                    progressContainer.innerHTML = `<div class="progress-bar">解析問題中.....</div>`;
                    chatMessages.appendChild(progressContainer);

                    // Step 3: Create response container (at the bottom, left side)
                    const responseContainer = document.createElement("div");
                    responseContainer.className = "message assistant";
                    const responseContent = document.createElement("div");
                    responseContent.className = "message-content";
                    responseContent.id = containerId; // Use content div as target for renderer

                    // Add "思考中 X 秒" indicator (will be cleared by renderer reset, but we'll re-add it)
                    const thinkIndicator = document.createElement("div");
                    thinkIndicator.className = "think-indicator";
                    thinkIndicator.id = `think-${timestamp}`;
                    thinkIndicator.textContent = "思考中 1 秒";
                    responseContent.appendChild(thinkIndicator);

                    // Start per-query thinking timer (starts fresh for each query)
                    let thinkSeconds = 1;
                    const thinkTimer = setInterval(() => {
                        thinkSeconds += 1;
                        // Update only this query's think indicator
                        const indicator = document.getElementById(
                            `think-${timestamp}`,
                        );
                        if (
                            indicator &&
                            indicator.style.display !== "none" &&
                            !indicator.classList.contains("finished")
                        ) {
                            indicator.textContent = `思考中 ${thinkSeconds} 秒`;
                            // Update stored seconds
                            responseContent.dataset.thinkSeconds = thinkSeconds;
                        } else {
                            clearInterval(thinkTimer);
                        }
                    }, 1000);

                    // Store timer ID and initial seconds so we can mark as finished when query completes
                    responseContent.dataset.thinkTimer = thinkTimer;
                    responseContent.dataset.thinkSeconds = thinkSeconds;

                    responseContainer.appendChild(responseContent);
                    chatMessages.appendChild(responseContainer);

                    // ✅ Scroll to show NEW query at top of viewport (push old messages out of view)
                    // This is the ONLY place scrolling happens - NOT during streaming
                    // Use the globally available scrollMessageToTop function
                    if (userMessageElement) {
                        window.scrollMessageToTop(userMessageElement);
                    }

                    // Completion callback - called when backend sends 'complete' event
                    // Now receives markdown content as second parameter, and optional aborted flag
                    const onStreamComplete = (
                        success,
                        markdownContent,
                        aborted = false,
                    ) => {
                        // Disconnect observer immediately to prevent any more scrolling
                        observerDisconnected = true;
                        observer.disconnect();

                        // Set a flag to prevent any further scrolling
                        window.streamJustCompleted = true;

                        // Progress bar is disabled - just hide it immediately
                        const progressContainer =
                            document.getElementById(progressId);
                        if (progressContainer) {
                            progressContainer.style.display = "none";
                        }

                        // Stop this query's think timer when AI finishes responding
                        const timerId = responseContent.dataset.thinkTimer;
                        if (timerId) {
                            clearInterval(parseInt(timerId));
                        }

                        // Mark think indicator as finished with final time
                        const indicator = document.getElementById(
                            `think-${timestamp}`,
                        );
                        if (indicator) {
                            const finalSeconds =
                                parseInt(
                                    responseContent.dataset.thinkSeconds,
                                ) || 1;
                            indicator.classList.add("finished");
                            indicator.textContent = `已完成 (${finalSeconds} 秒)`;
                        }

                        console.log(
                            `Stream completed: ${success ? "success" : "error"}${aborted ? " (user stopped)" : ""}`,
                        );

                        // ✅ FIX: 將 AI 回應保存到 chatHistory
                        // 使用從 renderer 傳遞過來的原始 markdown 內容
                        if (
                            success &&
                            markdownContent &&
                            markdownContent.trim()
                        ) {
                            // Mark aborted responses with suffix
                            const finalContent = aborted
                                ? markdownContent.trim() + "\n\n*[已停止生成]*"
                                : markdownContent.trim();

                            chatHistory.push({
                                content: finalContent,
                                role: "assistant",
                                sources: null,
                                timestamp: Date.now(),
                            });
                            saveChatHistory(); // sessionStorage
                            saveCurrentSkillChat(); // localStorage
                            console.log(
                                `💾 已保存 AI 回應到 chatHistory (${markdownContent.length} chars)${aborted ? " [stopped]" : ""}`,
                            );
                        }

                        // ✅ Reset UI state - restore to Send button
                        isLoading = false;
                        currentAbortController = null;
                        button.classList.remove("loading", "streaming");
                        button.onclick = sendQuery; // Restore send function
                        const buttonIcon = button.querySelector("i");
                        if (buttonIcon) {
                            buttonIcon.className = "fa-solid fa-paper-plane";
                        }
                        if (buttonText) buttonText.textContent = "搜尋";

                        // Re-enable/disable based on input content
                        const input = document.getElementById("query-input");
                        const inputValue = input.value.trim();
                        button.disabled = inputValue === "";

                        input.focus();

                        // ✅ Scroll to show the complete response after streaming finishes
                        // Progress bar is disabled, so no need to wait for hiding animation
                        setTimeout(() => {
                            const chatArea =
                                document.getElementById("chat-area");
                            const chatMsgs =
                                document.getElementById("chat-messages");
                            if (
                                chatArea &&
                                !window.userHasScrolled &&
                                chatMsgs
                            ) {
                                // Get current scroll position AFTER progress bar is hidden
                                const currentScrollTop = chatArea.scrollTop;
                                const lastMessage = chatMsgs.lastElementChild;

                                if (lastMessage) {
                                    // Get positions after progress bar is hidden
                                    const lastMessageRect =
                                        lastMessage.getBoundingClientRect();
                                    const chatAreaRect =
                                        chatArea.getBoundingClientRect();
                                    const messageBottom =
                                        lastMessageRect.bottom;
                                    const visibleBottom = chatAreaRect.bottom;

                                    // Only scroll if message extends below visible area
                                    const needsScroll =
                                        messageBottom > visibleBottom;

                                    // Reset padding WITHOUT transition to prevent layout shift
                                    const originalTransition =
                                        chatMsgs.style.transition;
                                    chatMsgs.style.transition = "none";
                                    chatMsgs.style.paddingBottom = "50vh";

                                    // Wait for layout to settle after padding change
                                    requestAnimationFrame(() => {
                                        requestAnimationFrame(() => {
                                            // Restore transition
                                            chatMsgs.style.transition =
                                                originalTransition;

                                            if (needsScroll) {
                                                // Recalculate after padding change
                                                const newLastMessageRect =
                                                    lastMessage.getBoundingClientRect();
                                                const newChatAreaRect =
                                                    chatArea.getBoundingClientRect();
                                                const newMessageBottom =
                                                    newLastMessageRect.bottom;
                                                const newVisibleBottom =
                                                    newChatAreaRect.bottom;
                                                const scrollNeeded =
                                                    newMessageBottom -
                                                    newVisibleBottom;

                                                if (scrollNeeded > 0) {
                                                    chatArea.scrollTop =
                                                        currentScrollTop +
                                                        scrollNeeded;
                                                } else {
                                                    // Already visible, maintain position
                                                    chatArea.scrollTop =
                                                        currentScrollTop;
                                                }
                                            } else {
                                                // Already fully visible, maintain exact position
                                                chatArea.scrollTop =
                                                    currentScrollTop;
                                            }

                                            // Clear the flag after scroll is done
                                            setTimeout(() => {
                                                window.streamJustCompleted = false;
                                            }, 100);
                                        });
                                    });
                                } else {
                                    // No last message, just reset padding
                                    chatMsgs.style.paddingBottom = "50vh";
                                    window.streamJustCompleted = false;
                                }
                            } else {
                                window.streamJustCompleted = false;
                            }
                        }, 100);
                    };

                    // Monitor for content changes to enable auto-scroll during streaming
                    let observerDisconnected = false;
                    const observer = new MutationObserver((mutations) => {
                        // Don't scroll if observer is disconnected (stream completed)
                        if (observerDisconnected) return;

                        // Auto-scroll to bottom during streaming (only if user hasn't scrolled up)
                        if (
                            !window.userHasScrolled &&
                            responseContent.children.length > 0
                        ) {
                            const hasContent = Array.from(
                                responseContent.children,
                            ).some(
                                (child) =>
                                    !child.classList.contains(
                                        "think-indicator",
                                    ) &&
                                    (child.textContent.trim().length > 0 ||
                                        child.querySelector("*")),
                            );

                            if (hasContent) {
                                // Scroll the chat area, not the window
                                setTimeout(() => {
                                    const chatArea =
                                        document.getElementById("chat-area");
                                    if (chatArea && !observerDisconnected) {
                                        chatArea.scrollTop =
                                            chatArea.scrollHeight;
                                    }
                                }, 50);
                            }
                        }
                    });

                    observer.observe(responseContent, {
                        childList: true,
                        subtree: true,
                    });

                    // Use progressive renderer with completion callback and abort signal
                    // ✅ Pass Memory parameters for multi-turn conversation support
                    startProgressiveChat(
                        query,
                        `/api/v1/skills/${skillId}/chat/stream`,
                        `#${containerId}`, // Unique response container
                        `#${progressId} .progress-bar`, // Unique progress bar
                        documentIds, // ✅ Use expanded document IDs (not skillIds)
                        onStreamComplete,
                        currentAbortController.signal, // ✅ Pass abort signal for stop generation
                        {
                            user_id: getCurrentUserId(), // ✅ Reuse existing getCurrentUserId()
                            include_history: true,
                            history_limit: 10,
                        },
                    );
                } catch (error) {
                    console.error("Progressive streaming failed:", error);
                    addMessage("😔 系統發生錯誤，請稍後再試", "assistant");

                    // ✅ Reset UI state - restore to Send button
                    isLoading = false;
                    currentAbortController = null;
                    button.classList.remove("loading", "streaming");
                    button.onclick = sendQuery; // Restore send function
                    const buttonIcon = button.querySelector("i");
                    if (buttonIcon) {
                        buttonIcon.className = "fa-solid fa-paper-plane";
                    }
                    if (buttonText) buttonText.textContent = "搜尋";

                    // Re-enable/disable based on input content
                    const input = document.getElementById("query-input");
                    const inputValue = input.value.trim();
                    button.disabled = inputValue === "";

                    input.focus();
                }
            }

            // ===== User ID Management for Memory =====
            function getCurrentUserId() {
                return (
                    localStorage.getItem("docai_user_id") ||
                    "5a19a0da-7485-4656-8641-41402fef4049"
                );
            }

            // ===== Traditional Query (Fallback) =====
            async function sendTraditionalQuery(query) {
                isLoading = true;
                const button = document.getElementById("send-button");
                button.classList.add("loading");
                button.disabled = true;

                // ✅ Add user message and scroll to it
                const userMessageElement = addMessage(query, "user");

                // ✅ Scroll to show NEW query at top of viewport (push old messages out of view)
                // Use the globally available scrollMessageToTop function
                if (userMessageElement) {
                    window.scrollMessageToTop(userMessageElement);
                }

                // Create response container with think indicator
                const chatMessages = document.getElementById("chat-messages");
                const timestamp = Date.now();
                const responseContainer = document.createElement("div");
                responseContainer.className = "message assistant";
                const responseContent = document.createElement("div");
                responseContent.className = "message-content";
                responseContent.id = `response-${timestamp}`;

                // Add "思考中 X 秒" indicator
                const thinkIndicator = document.createElement("div");
                thinkIndicator.className = "think-indicator";
                thinkIndicator.id = `think-${timestamp}`;
                thinkIndicator.textContent = "思考中 1 秒";
                responseContent.appendChild(thinkIndicator);

                // Start per-query thinking timer (starts fresh for each query)
                let thinkSeconds = 1;
                const thinkTimer = setInterval(() => {
                    thinkSeconds += 1;
                    // Update only this query's think indicator
                    const indicator = document.getElementById(
                        `think-${timestamp}`,
                    );
                    if (indicator && indicator.style.display !== "none") {
                        indicator.textContent = `思考中 ${thinkSeconds} 秒`;
                    } else {
                        clearInterval(thinkTimer);
                    }
                }, 1000);

                // Store timer ID so we can clear it when query completes
                responseContent.dataset.thinkTimer = thinkTimer;

                responseContainer.appendChild(responseContent);
                chatMessages.appendChild(responseContainer);

                // Show loading overlay
                showLoading();

                try {
                    // Build request body - support single and multi-skill queries + Memory
                    const skillIds = selectedSkills.map((s) => s.id);
                    const requestBody = {
                        skill_id: skillIds.length === 1 ? skillIds[0] : null,
                        skill_ids: skillIds.length > 1 ? skillIds : null,
                        query: query,
                        top_k: 10,
                        // Memory parameters
                        user_id: getCurrentUserId(),
                        include_history: true,
                        history_limit: 10,
                    };

                    // Try demo query endpoint first
                    const response = await fetch("/api/v1/skills/demo/query", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(requestBody),
                    });

                    const result = await response.json();

                    // Stop this query's think timer when AI finishes responding
                    const timerId = responseContent.dataset.thinkTimer;
                    if (timerId) {
                        clearInterval(parseInt(timerId));
                    }

                    // Mark think indicator as finished with final time
                    const indicator = document.getElementById(
                        `think-${timestamp}`,
                    );
                    if (indicator) {
                        const finalSeconds =
                            parseInt(responseContent.dataset.thinkSeconds) || 1;
                        indicator.classList.add("finished");
                        indicator.textContent = `已完成 (${finalSeconds} 秒)`;
                    }

                    if (response.ok) {
                        // Show search mode info for multi-skill queries
                        const searchInfo =
                            result.documents_searched > 1
                                ? `\n\n_📚 ${t("skill_tree.searched_count", { count: result.documents_searched })}_`
                                : "";
                        // ✅ FIX: Update the response content, preserving think indicator
                        const indicator = document.getElementById(
                            `think-${timestamp}`,
                        );
                        const indicatorHtml = indicator
                            ? indicator.outerHTML
                            : "";
                        let html = marked.parse(
                            (result.answer || "找到相關內容") + searchInfo,
                        );

                        // Add sources if available
                        if (result.results && result.results.length > 0) {
                            let sourcesHtml = `
                            <div class="sources">
                                <div class="sources-title">
                                    <i class="fa-solid fa-book-open"></i>
                                    ${t("chat.sources_title")} (${result.results.length})
                                </div>
                        `;
                            result.results.slice(0, 3).forEach((s) => {
                                const score = s.score
                                    ? ((1 - s.score) * 100).toFixed(0)
                                    : "N/A";
                                const filename =
                                    s.source_name ||
                                    s.metadata?.document_name ||
                                    "Unknown";
                                const preview = s.content
                                    ? s.content.substring(0, 100) + "..."
                                    : "";
                                sourcesHtml += `
                                <div class="source-item">
                                    <strong>${filename}</strong> (${t("chat.relevance")}: ${score}%)<br>
                                    <span style="color: #6b7280;">${preview}</span>
                                </div>
                            `;
                            });
                            sourcesHtml += "</div>";
                            html += sourcesHtml;
                        }

                        responseContent.innerHTML = indicatorHtml + html;

                        // Scroll to show the complete response after query finishes
                        setTimeout(() => {
                            const chatArea =
                                document.getElementById("chat-area");
                            if (chatArea && !window.userHasScrolled) {
                                chatArea.scrollTop = chatArea.scrollHeight;
                            }
                        }, 100);
                    } else {
                        // 用戶友好的錯誤訊息，不顯示技術細節
                        console.error("Query error:", result.detail);
                        // Preserve think indicator when setting error message
                        const indicator = document.getElementById(
                            `think-${timestamp}`,
                        );
                        const indicatorHtml = indicator
                            ? indicator.outerHTML
                            : "";
                        responseContent.innerHTML =
                            indicatorHtml +
                            "<p>😔 " +
                            t("chat.no_data_error") +
                            "</p>";

                        // Scroll to show error message
                        setTimeout(() => {
                            const chatArea =
                                document.getElementById("chat-area");
                            if (chatArea && !window.userHasScrolled) {
                                chatArea.scrollTop = chatArea.scrollHeight;
                            }
                        }, 100);
                    }
                } catch (error) {
                    console.error("Query failed:", error);
                    // Stop this query's think timer on error
                    const timerId = responseContent.dataset.thinkTimer;
                    if (timerId) {
                        clearInterval(parseInt(timerId));
                    }
                    // Preserve think indicator when setting error message
                    const indicator = document.getElementById(
                        `think-${timestamp}`,
                    );
                    const indicatorHtml = indicator ? indicator.outerHTML : "";
                    responseContent.innerHTML =
                        indicatorHtml +
                        "<p>😔 " +
                        t("chat.network_error") +
                        "</p>";
                } finally {
                    isLoading = false;
                    button.classList.remove("loading");
                    button.disabled = false;

                    // Hide loading overlay
                    hideLoading();

                    const input = document.getElementById("query-input");
                    input.focus();
                }
            }

            // ===== Add Message =====
            function addMessage(content, role, sources = null) {
                const container = document.getElementById("chat-messages");

                // Save to chat history for persistence
                chatHistory.push({
                    content: content,
                    role: role,
                    sources: sources,
                    timestamp: Date.now(),
                });
                // RESTORED 2025-12-12: Chat history persistence re-enabled per user request
                saveChatHistory(); // Persist to sessionStorage (for page refresh)
                saveCurrentSkillChat(); // ✅ Persist to localStorage (for skill switching)

                const message = document.createElement("div");
                message.className = `message ${role}`;

                const messageContent = document.createElement("div");
                messageContent.className = "message-content";

                let html = "";

                if (role === "assistant") {
                    html = marked.parse(content);
                } else {
                    html = `<p>${escapeHtml(content)}</p>`;
                }

                // Add sources
                if (sources && sources.length > 0) {
                    html += `
                    <div class="sources">
                        <div class="sources-title">
                            <i class="fa-solid fa-book-open"></i>
                            ${t("chat.sources_title")} (${sources.length})
                        </div>
                `;

                    sources.slice(0, 3).forEach((s) => {
                        const score = s.score
                            ? ((1 - s.score) * 100).toFixed(0)
                            : "N/A";
                        // Try multiple sources for filename: source_name, citation, metadata.filename
                        const filename =
                            s.source_name ||
                            s.metadata?.document_name ||
                            s.metadata?.filename ||
                            "Unknown";
                        const preview = s.content
                            ? s.content.substring(0, 100) + "..."
                            : "";

                        html += `
                        <div class="source-item">
                            <strong>${filename}</strong> (${t("chat.relevance")}: ${score}%)<br>
                            <span style="color: #6b7280;">${preview}</span>
                        </div>
                    `;
                    });

                    html += "</div>";
                }

                messageContent.innerHTML = html;
                message.appendChild(messageContent);
                // ✅ Standard chat layout: Append to bottom (newest at bottom)
                container.appendChild(message);

                // Note: Scrolling is handled by the caller (sendProgressiveQuery/sendTraditionalQuery)
                // to allow custom scroll positioning (e.g., scroll to query position)

                // Return the message element for potential scroll positioning
                return message;
            }

            // ===== Clear Chat =====
            async function clearChat() {
                const container = document.getElementById("chat-messages");
                container.innerHTML = "";

                // ✅ 清除當前 skill 的 localStorage（修復 Bug：清除按鈕無法清除 localStorage）
                if (currentSkillId) {
                    const key = SKILL_CHAT_PREFIX + currentSkillId;
                    localStorage.removeItem(key);
                    console.log(`🗑️ 已清除 localStorage: ${key}`);

                    // ✅ 同時清除 MongoDB 中的 session（防止 Prompt Leaking）
                    await clearMongoDBSession(currentSkillId);
                }

                // Clear session storage
                clearSessionState();

                // Clear in-memory chat history
                chatHistory = [];

                if (selectedSkills.length === 0) {
                    document.getElementById("welcome-message").style.display =
                        "block";
                    container.style.display = "none";

                    // Disable add document button when no skill is selected
                    const addDocBtn =
                        document.getElementById("add-document-btn");
                    if (addDocBtn) {
                        addDocBtn.disabled = true;
                    }
                }

                console.log("✅ 對話已完全清除（localStorage + MongoDB + UI）");
            }

            // ===== Clear MongoDB Session =====
            async function clearMongoDBSession(skillId) {
                try {
                    const userId = getCurrentUserId();
                    const sessionId = `skill_${userId}_${skillId}`;

                    const response = await fetch(
                        `/api/v1/skills/sessions/${encodeURIComponent(sessionId)}`,
                        {
                            method: "DELETE",
                            headers: {
                                "Content-Type": "application/json",
                            },
                        },
                    );

                    if (response.ok) {
                        const result = await response.json();
                        console.log(
                            `🗑️ MongoDB session 已清除: ${sessionId}`,
                            result,
                        );
                    } else {
                        console.warn(
                            `⚠️ MongoDB session 清除失敗: ${response.status}`,
                        );
                    }
                } catch (error) {
                    console.error("❌ 清除 MongoDB session 時發生錯誤:", error);
                }
            }

            // ===== Clear All Sessions (完全重置) =====
            async function clearAllSessions() {
                if (
                    !confirm(
                        "確定要清除所有對話記錄嗎？這將清除所有 Skill 的對話歷史。",
                    )
                ) {
                    return;
                }

                try {
                    // 1. 清除所有 skill 相關的 localStorage
                    const keysToRemove = [];
                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        if (key && key.startsWith(SKILL_CHAT_PREFIX)) {
                            keysToRemove.push(key);
                        }
                    }
                    keysToRemove.forEach((key) => {
                        localStorage.removeItem(key);
                        console.log(`🗑️ 已清除 localStorage: ${key}`);
                    });

                    // 2. 清除所有 MongoDB sessions
                    const response = await fetch(
                        "/api/v1/skills/sessions/clear-all",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                            },
                        },
                    );

                    if (response.ok) {
                        const result = await response.json();
                        console.log("🗑️ 所有 MongoDB sessions 已清除:", result);
                        alert(`已清除 ${result.deleted_count} 個對話記錄`);
                    } else {
                        console.warn("⚠️ MongoDB sessions 清除失敗");
                    }

                    // 3. 清除當前頁面
                    const container = document.getElementById("chat-messages");
                    container.innerHTML = "";
                    chatHistory = [];
                    clearSessionState();

                    console.log("✅ 所有對話記錄已完全清除");
                } catch (error) {
                    console.error("❌ 清除所有 sessions 時發生錯誤:", error);
                    alert("清除失敗，請查看控制台");
                }
            }

            // ===== MODEL SELECTOR FUNCTIONS =====
            let currentModel = null; // Will be loaded from localStorage or system default
            let availableModels = []; // Models from Ollama

            /**

            function closeModelDropdown() {
